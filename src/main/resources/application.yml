spring:
  application:
    name: inventory-api

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/inventory}
    username: ${SPRING_DATASOURCE_USERNAME:inventory}
    password: ${SPRING_DATASOURCE_PASSWORD:inventory}
    driver-class-name: org.postgresql.Driver

  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
    baseline-on-migrate: false
    baseline-version: 1
    out-of-order: false

  thymeleaf:
    cache: false

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
  api-docs:
    path: /v3/api-docs

logging:
  level:
    root: WARN
    org.acme.inventory: INFO
    org.springdoc.core.events: ERROR
    org.springframework.web: WARN
    org.springframework.jdbc: WARN
    org.springframework.security: WARN
    org.springframework.transaction: WARN
    org.springframework.web.servlet: WARN
