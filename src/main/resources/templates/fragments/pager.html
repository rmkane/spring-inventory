<nav xmlns:th="http://www.thymeleaf.org" class="pager" th:fragment="pager(action)" aria-label="Pagination">
    <label class="pager-section">Items per page
        <select onchange="window.location.href = this.value">
            <option th:each="pageSize : ${pageSizes}"
                    th:value="@{${action}(page=1, size=${pageSize}, sort=${pageQuery.sort}, dir=${pageQuery.dir})}"
                    th:selected="${page.size == pageSize}"
                    th:text="${pageSize}">10</option>
        </select>
    </label>
    <p class="pager-section pager-range"
       th:text="|${page.fromIndex}–${page.toIndex} of ${page.totalElements} items|">1–10 of 10 items</p>
    <label class="pager-section">
        <select onchange="window.location.href = this.value" aria-label="Page">
            <option th:each="pageNumber : ${#numbers.sequence(1, page.lastPage)}"
                    th:value="@{${action}(page=${pageNumber}, size=${pageQuery.size}, sort=${pageQuery.sort}, dir=${pageQuery.dir})}"
                    th:selected="${page.page == pageNumber}"
                    th:text="${pageNumber}">1</option>
        </select>
        of <span th:text="${page.lastPage}">1</span> pages
    </label>
    <div class="pager-section pager-nav">
        <a class="pager-btn"
           th:classappend="${!page.hasPrevious()} ? ' is-disabled'"
           th:href="${page.hasPrevious()} ? @{${action}(page=${page.page - 1}, size=${pageQuery.size}, sort=${pageQuery.sort}, dir=${pageQuery.dir})} : null"
           aria-label="Previous page">‹</a>
        <a class="pager-btn"
           th:classappend="${!page.hasNext()} ? ' is-disabled'"
           th:href="${page.hasNext()} ? @{${action}(page=${page.page + 1}, size=${pageQuery.size}, sort=${pageQuery.sort}, dir=${pageQuery.dir})} : null"
           aria-label="Next page">›</a>
    </div>
</nav>
