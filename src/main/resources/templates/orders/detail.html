<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: main(~{::title}, 'orders', ~{::section})}">
<head>
    <title>Order</title>
</head>
<body>
<section class="stack">
    <p><a th:href="@{/ui/orders}">Back to orders</a></p>
    <article class="panel">
        <h1 class="page-title">Order</h1>
        <p>Status: <span th:text="${order.status}">PENDING</span></p>
        <p>Customer: <a th:href="@{/ui/customers/{id}(id=${customer.id})}" th:text="${customer.name}">Customer</a></p>
        <p>Total: <span th:text="${#numbers.formatDecimal(order.total(), 1, 2)}">0.00</span></p>
        <p class="muted">Created <span th:text="${#temporals.format(order.createdAt, 'yyyy-MM-dd HH:mm')}">date</span></p>
    </article>
    <table>
        <thead>
        <tr>
            <th>Product</th>
            <th>Quantity</th>
            <th>Unit price</th>
            <th>Line total</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="item : ${order.items}">
            <td><a th:href="@{/ui/products/{id}(id=${item.productId})}" th:text="${item.productName}">Name</a></td>
            <td th:text="${item.quantity}">1</td>
            <td th:text="${#numbers.formatDecimal(item.unitPrice, 1, 2)}">0.00</td>
            <td th:text="${#numbers.formatDecimal(item.lineTotal(), 1, 2)}">0.00</td>
        </tr>
        </tbody>
    </table>
</section>
</body>
</html>
