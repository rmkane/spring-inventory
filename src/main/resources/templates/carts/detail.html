<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: main(~{::title}, 'carts', ~{::section})}">
<head>
    <title>Cart</title>
</head>
<body>
<section class="stack">
    <p><a th:href="@{/ui/carts}">Back to carts</a></p>
    <article class="panel">
        <h1 class="page-title">Cart</h1>
        <p>Customer: <a th:href="@{/ui/customers/{id}(id=${customer.id})}" th:text="${customer.name}">Customer</a></p>
    </article>
    <table>
        <thead>
        <tr>
            <th>Product</th>
            <th>Quantity</th>
            <th>Added</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="item : ${cart.items}">
            <td><a th:href="@{/ui/products/{id}(id=${item.productId})}" th:text="${item.productName}">Name</a></td>
            <td th:text="${item.quantity}">1</td>
            <td th:text="${#temporals.format(item.addedAt, 'yyyy-MM-dd HH:mm')}">date</td>
        </tr>
        </tbody>
    </table>
</section>
</body>
</html>
