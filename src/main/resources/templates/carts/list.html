<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: main(~{::title}, 'carts', ~{::section})}">
<head>
    <title>Carts</title>
</head>
<body>
<section>
    <h1 class="page-title">Carts</h1>
    <table>
        <thead>
        <tr>
            <th th:replace="~{fragments/sort :: header('/ui/carts', 'id', 'Cart')}">Cart</th>
            <th th:replace="~{fragments/sort :: header('/ui/carts', 'customerId', 'Customer')}">Customer</th>
            <th th:replace="~{fragments/sort :: header('/ui/carts', 'items', 'Items')}">Items</th>
            <th th:replace="~{fragments/sort :: header('/ui/carts', 'total', 'Total')}">Total</th>
            <th th:replace="~{fragments/sort :: header('/ui/carts', 'updatedAt', 'Updated')}">Updated</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="cart : ${carts}">
            <td><a th:href="@{/ui/carts/{id}(id=${cart.id})}" th:text="${cart.id}">id</a></td>
            <td><a th:href="@{/ui/customers/{id}(id=${cart.customerId})}"
                   th:text="${customersById.get(cart.customerId).name}">Customer</a></td>
            <td th:text="${#lists.size(cart.items)}">0</td>
            <td th:text="${#numbers.formatDecimal(cart.total(), 1, 2)}">0.00</td>
            <td th:text="${#temporals.format(cart.updatedAt, 'yyyy-MM-dd HH:mm')}">date</td>
        </tr>
        </tbody>
    </table>
    <nav th:replace="~{fragments/pager :: pager('/ui/carts')}"></nav>
</section>
</body>
</html>
