<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: main(~{::title}, 'carts', ~{::section})}">
<head>
    <title>Carts</title>
</head>
<body>
<section>
    <h1 class="page-title">Carts</h1>
    <table>
        <thead>
        <tr>
            <th>Cart</th>
            <th>Customer</th>
            <th>Items</th>
            <th>Updated</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="cart : ${carts}">
            <td><a th:href="@{/ui/carts/{id}(id=${cart.id})}" th:text="${cart.id}">id</a></td>
            <td><a th:href="@{/ui/customers/{id}(id=${cart.customerId})}"
                   th:text="${customersById.get(cart.customerId).name}">Customer</a></td>
            <td th:text="${#lists.size(cart.items)}">0</td>
            <td th:text="${#temporals.format(cart.updatedAt, 'yyyy-MM-dd HH:mm')}">date</td>
        </tr>
        </tbody>
    </table>
</section>
</body>
</html>
