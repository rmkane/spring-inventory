<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: main(~{::title}, 'products', ~{::section})}">
<head>
    <title>Products</title>
</head>
<body>
<section>
    <h1 class="page-title">Products</h1>
    <table>
        <thead>
        <tr>
            <th th:replace="~{fragments/sort :: header('/ui/products', 'name', 'Name')}">Name</th>
            <th th:replace="~{fragments/sort :: header('/ui/products', 'price', 'Price')}">Price</th>
            <th th:replace="~{fragments/sort :: header('/ui/products', 'quantityOnHand', 'On hand')}">On hand</th>
            <th th:replace="~{fragments/sort :: header('/ui/products', 'quantityReserved', 'Reserved')}">Reserved</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="product : ${products}">
            <td><a th:href="@{/ui/products/{id}(id=${product.id})}" th:text="${product.name}">Name</a></td>
            <td th:text="${#numbers.formatDecimal(product.price, 1, 2)}">0.00</td>
            <td th:text="${product.quantityOnHand}">0</td>
            <td th:text="${product.quantityReserved}">0</td>
        </tr>
        </tbody>
    </table>
    <nav th:replace="~{fragments/pager :: pager('/ui/products')}"></nav>
</section>
</body>
</html>
