<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: main(~{::title}, 'inventory', ~{::section})}">
<head>
    <title>Inventory</title>
</head>
<body>
<section>
    <h1 class="page-title">Inventory</h1>
    <table>
        <thead>
        <tr>
            <th th:replace="~{fragments/sort :: header('/ui/inventory', 'productId', 'Product')}">Product</th>
            <th th:replace="~{fragments/sort :: header('/ui/inventory', 'quantityOnHand', 'On hand')}">On hand</th>
            <th th:replace="~{fragments/sort :: header('/ui/inventory', 'quantityReserved', 'Reserved')}">Reserved</th>
            <th th:replace="~{fragments/sort :: header('/ui/inventory', 'updatedAt', 'Updated')}">Updated</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="row : ${inventory}">
            <td><a th:href="@{/ui/products/{id}(id=${row.productId})}"
                   th:text="${productsById.get(row.productId).name}">Name</a></td>
            <td th:text="${row.quantityOnHand}">0</td>
            <td th:text="${row.quantityReserved}">0</td>
            <td th:text="${#temporals.format(row.updatedAt, 'yyyy-MM-dd HH:mm')}">date</td>
        </tr>
        </tbody>
    </table>
    <nav th:replace="~{fragments/pager :: pager('/ui/inventory')}"></nav>
</section>
</body>
</html>
