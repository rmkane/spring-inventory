<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: main(~{::title}, 'customers', ~{::section})}">
<head>
    <title th:text="${customer.name}">Customer</title>
</head>
<body>
<section class="stack">
    <p><a th:href="@{/ui/customers}">Back to customers</a></p>
    <article class="panel">
        <h1 class="page-title" th:text="${customer.name}">Customer</h1>
        <p th:text="${customer.email}">email@example.com</p>
        <p class="muted">Joined <span th:text="${#temporals.format(customer.createdAt, 'yyyy-MM-dd')}">date</span></p>
    </article>
    <h2>Carts</h2>
    <p th:if="${#lists.isEmpty(carts)}" class="muted">This customer has no carts.</p>
    <table th:unless="${#lists.isEmpty(carts)}">
        <thead>
        <tr>
            <th>Cart</th>
            <th>Items</th>
            <th>Total</th>
            <th>Updated</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="cart : ${carts}">
            <td><a th:href="@{/ui/carts/{id}(id=${cart.id})}" th:text="${cart.id}">id</a></td>
            <td th:text="${#lists.size(cart.items)}">0</td>
            <td th:text="${#numbers.formatDecimal(cart.total(), 1, 2)}">0.00</td>
            <td th:text="${#temporals.format(cart.updatedAt, 'yyyy-MM-dd HH:mm')}">date</td>
        </tr>
        </tbody>
    </table>
    <h2>Orders</h2>
    <p th:if="${#lists.isEmpty(orders)}" class="muted">This customer has no orders.</p>
    <table th:unless="${#lists.isEmpty(orders)}">
        <thead>
        <tr>
            <th>Order</th>
            <th>Status</th>
            <th>Items</th>
            <th>Total</th>
            <th>Created</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="order : ${orders}">
            <td><a th:href="@{/ui/orders/{id}(id=${order.id})}" th:text="${order.id}">id</a></td>
            <td th:text="${order.status}">PENDING</td>
            <td th:text="${#lists.size(order.items)}">0</td>
            <td th:text="${#numbers.formatDecimal(order.total(), 1, 2)}">0.00</td>
            <td th:text="${#temporals.format(order.createdAt, 'yyyy-MM-dd HH:mm')}">date</td>
        </tr>
        </tbody>
    </table>
</section>
</body>
</html>
